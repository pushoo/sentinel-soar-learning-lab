# Learning lab: minimal TheHive 5 stack (TheHive + Cassandra + Elasticsearch), memory-capped (~4 GB total).
# Images are multi-arch (amd64 + arm64). Not a production layout: no TLS, single node, no backups.
# The application secret comes from .env (created by soar/install-thehive.sh).
services:
  cassandra:
    image: cassandra:4.1
    restart: unless-stopped
    mem_limit: 1600m
    environment:
      - MAX_HEAP_SIZE=1024M
      - HEAP_NEWSIZE=256M
      - CASSANDRA_CLUSTER_NAME=TheHive
    volumes:
      - cassandra-data:/var/lib/cassandra

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.25
    restart: unless-stopped
    mem_limit: 1200m
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data

  thehive:
    image: strangebee/thehive:5.6.2-1
    restart: unless-stopped
    depends_on:
      - cassandra
      - elasticsearch
    mem_limit: 1500m
    ports:
      - "9000:9000"
    environment:
      - JVM_OPTS=-Xms768M -Xmx768M
    command:
      - --secret
      - "${THEHIVE_SECRET:?run soar/install-thehive.sh to create .env}"
      - --cql-hostnames
      - cassandra
      - --index-backend
      - elasticsearch
      - --es-hostnames
      - elasticsearch
      - --no-config-cortex
    volumes:
      - thehive-files:/opt/thp/thehive/files

volumes:
  cassandra-data:
  es-data:
  thehive-files:
